name: Release — Build · Sign · Upload AGC

# ============================================================
# 触发条件
#   1. 推送 tag vX.Y.Z（由本地 bin/release 脚本触发的标准流程）
#   2. workflow_dispatch 手动触发，可指定版本号 / 发布类型 / 跳过 AGC 上传 / 使用自托管 runner
#
# 构建环境：托管 runner 使用自建 GHCR 镜像（ghcr.io/<owner>/harmonyos-ci，由 docker-image.yml 构建），
#           镜像内预装 DevEco Command Line Tools + JDK17，无需每次下载 SDK
# ============================================================
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: '手动版本号 x.y.z（tag 触发时自动忽略）'
        required: false
        default: ''
      release_type:
        description: 'AGC 发布类型：1=全量发布 · 6=HarmonyOS 测试（首次/非稳定版本建议选 6）'
        required: false
        default: '6'
      skip_agc_upload:
        description: '跳过 AGC 上传（仅出包 + 挂载 GitHub Release）'
        required: false
        type: boolean
        default: false
      runner_pool:
        description: 'Runner：ubuntu-latest=托管（用自建 GHCR 镜像，零配置）；self-hosted=自安装 SDK'
        required: false
        type: choice
        options:
          - ubuntu-latest
          - self-hosted
        default: ubuntu-latest

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# 环境默认值（可通过仓库 Variables 覆盖）
env:
  BUNDLE_NAME: cn.oicode.timelynotify
  OHPM_REGISTRY: ${{ vars.OHPM_REGISTRY }}

# 统一用 bash 跑 run 步骤：容器内默认 sh(dash) 不支持 set -o pipefail
defaults:
  run:
    shell: bash

# ============================================================
# Job 1 · prepare —— 解析版本号，输出到下游 jobs
# ============================================================
jobs:
  prepare:
    name: Prepare · 解析版本号
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      version_code: ${{ steps.parse.outputs.version_code }}
      tag: ${{ steps.parse.outputs.tag }}
      release_type: ${{ steps.parse.outputs.release_type }}
      skip_agc_upload: ${{ steps.parse.outputs.skip_agc_upload }}
      runner_pool: ${{ steps.parse.outputs.runner_pool }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 解析版本号
        id: parse
        run: |
          set -euo pipefail
          # ---- 1. 版本号来源：tag 优先 → 手动输入 → 报错 ----
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME:-}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            TAG="$GITHUB_REF_NAME"
            echo "触发方式: tag push ($TAG)"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            V="${{ github.event.inputs.version }}"
            VERSION="${V#v}"
            TAG="v$VERSION"
            echo "触发方式: workflow_dispatch (手动版本 $TAG)"
          else
            echo "错误: 既不是 tag 触发也未提供手动 version 输入"
            exit 1
          fi

          # ---- 2. 格式校验 + 计算 versionCode ----
          if ! [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "错误: 版本号 '$VERSION' 不是 x.y.z 格式"
            exit 1
          fi
          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"
          # 各段范围约束（与 bin/release 一致）
          if [ "$MAJOR" -gt 2147 ] || [ "$MINOR" -ge 1000 ] || [ "$PATCH" -ge 1000 ]; then
            echo "错误: 版本段越界（major≤2147, minor/patch<1000）"
            exit 1
          fi
          VERSION_CODE=$(( MAJOR * 1000000 + MINOR * 1000 + PATCH ))

          # ---- 3. 发布类型 ----
          RELEASE_TYPE="${{ github.event.inputs.release_type }}"
          RELEASE_TYPE="${RELEASE_TYPE:-6}"   # tag 触发时默认 HarmonyOS 测试

          # ---- 4. 其他输入透传 ----
          SKIP_AGC="${{ github.event.inputs.skip_agc_upload }}"
          SKIP_AGC="${SKIP_AGC:-false}"
          RUNNER="${{ github.event.inputs.runner_pool }}"
          RUNNER="${RUNNER:-ubuntu-latest}"

          # ---- 5. 输出 ----
          echo "version=$VERSION"        >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"                >> "$GITHUB_OUTPUT"
          echo "release_type=$RELEASE_TYPE" >> "$GITHUB_OUTPUT"
          echo "skip_agc_upload=$SKIP_AGC"  >> "$GITHUB_OUTPUT"
          echo "runner_pool=$RUNNER"     >> "$GITHUB_OUTPUT"

          echo "========================================"
          echo "  Tag:           $TAG"
          echo "  versionName:   $VERSION"
          echo "  versionCode:   $VERSION_CODE"
          echo "  AGC 类型:      $RELEASE_TYPE (1=全量 6=HarmonyOS 测试)"
          echo "  跳过 AGC:      $SKIP_AGC"
          echo "  Runner:        $RUNNER"
          echo "========================================"

# ============================================================
# Job 2 · build-sign —— assembleApp 构建 unsigned.app → hap-sign-tool 对 .app 整体重签名
#   （HarmonyOS NEXT 签名架构：签名块附加在 .app(zip) 尾部，包内 HAP 不含签名条目——
#     实测 hvigor 原生产物：signed.app = unsigned.app + ~15KB 尾部签名块；
#     hap-sign-tool 只有 sign-app/verify-app，无 HAP 签名子命令；
#     不可拆包单签 HAP 再回填，AGC 会报 991 非法软件包）
# ============================================================
  build-sign:
    name: Build · Sign APP
    needs: prepare
    runs-on: ${{ needs.prepare.outputs.runner_pool }}
    timeout-minutes: 30
    # attest-build-provenance 需要 OIDC token + attestations 写权限（GitHub 官方签名密钥签发构建溯源证明）
    # packages:read 用于拉取私有可见性的 GHCR CI 镜像（公开镜像不需要，但声明无害）
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: read
    # 托管 runner 用自建 GHCR CI 镜像（预装 DevEco CLT + JDK17，见 docker-image.yml）；
    # 表达式结果为空串时 = 不使用容器（self-hosted 走机器上预装的 SDK）
    container: ${{ needs.prepare.outputs.runner_pool == 'ubuntu-latest' && (vars.CI_IMAGE || format('ghcr.io/{0}/harmonyos-ci:latest', github.repository_owner)) || '' }}
    outputs:
      cert_fingerprint: ${{ steps.cert_fp.outputs.fingerprint }}
      commit_sha: ${{ steps.buildinfo.outputs.commit_sha }}
      build_time: ${{ steps.buildinfo.outputs.build_time }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      VERSION_CODE: ${{ needs.prepare.outputs.version_code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      # --------------------------------------------------------
      # 环境准备：JDK 17（仅 self-hosted 兜底；CI 镜像内已内置 openjdk-17）
      # --------------------------------------------------------
      - name: Setup JDK 17（self-hosted 兜底）
        if: needs.prepare.outputs.runner_pool == 'self-hosted'
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # --------------------------------------------------------
      # 容器内工具链环境（托管 runner）
      #   CI 镜像布局：/opt/harmonyos-tools/command-line-tools/{bin, sdk/default, tool/node}
      #   逐项校验存在性，镜像版本不符时立即报错并提示用 vars.CI_IMAGE 覆盖
      # --------------------------------------------------------
      - name: 容器内工具链环境（托管 runner）
        if: needs.prepare.outputs.runner_pool == 'ubuntu-latest'
        run: |
          set -euo pipefail
          # 容器内当前用户(root)与宿主 checkout 属主(runner)不一致，git 会报 dubious ownership 拒绝操作
          git config --global --add safe.directory "${GITHUB_WORKSPACE:-$(pwd)}"
          CLT_ROOT="/opt/harmonyos-tools/command-line-tools"
          for p in "$CLT_ROOT/sdk/default" "$CLT_ROOT/tool/node" "$CLT_ROOT/bin/hvigorw" "$CLT_ROOT/bin/ohpm"; do
            [ -e "$p" ] || { echo "错误: CI 镜像内缺少 $p"; echo "镜像版本与预期不符？可用仓库 Variable CI_IMAGE 指定其他镜像"; exit 1; }
          done
          echo "DEVECO_SDK_HOME=$CLT_ROOT/sdk" >> "$GITHUB_ENV"
          echo "NODE_HOME=$CLT_ROOT/tool/node"        >> "$GITHUB_ENV"
          echo "HVIGORW=$CLT_ROOT/bin/hvigorw"        >> "$GITHUB_ENV"
          echo "OHPM=$CLT_ROOT/bin/ohpm"              >> "$GITHUB_ENV"

      # --------------------------------------------------------
      # 环境校验（自托管也走一次，确认路径有效）
      # --------------------------------------------------------
      - name: 环境信息校验
        run: |
          set -euo pipefail
          : "${DEVECO_SDK_HOME:?需要 DEVECO_SDK_HOME（自托管请预装 SDK 并写入环境变量；托管已由上一步设置）}"
          : "${NODE_HOME:?需要 NODE_HOME}"
          HVIGORW="${HVIGORW:-$(command -v hvigorw || true)}"
          : "${HVIGORW:?未找到 hvigorw，自托管请确保在 PATH 或设置 HVIGORW 变量}"
          export PATH="$NODE_HOME/bin:$PATH"
          echo "DEVECO_SDK_HOME=$DEVECO_SDK_HOME"
          echo "NODE_HOME       =$NODE_HOME"
          echo "HVIGORW         =$HVIGORW"
          node -v
          npm -v
          java -version
          ls "$DEVECO_SDK_HOME" || true
          # 记录到 GITHUB_ENV 供后续步骤使用
          echo "PATH=$NODE_HOME/bin:$PATH"       >> "$GITHUB_ENV"
          echo "HVIGORW=$HVIGORW"                 >> "$GITHUB_ENV"
          # ohpm 定位
          if command -v ohpm >/dev/null 2>&1; then echo "OHPM=$(which ohpm)" >> "$GITHUB_ENV"
          elif [ -f "$DEVECO_SDK_HOME/../tools/ohpm/bin/ohpm" ]; then echo "OHPM=$DEVECO_SDK_HOME/../tools/ohpm/bin/ohpm" >> "$GITHUB_ENV"
          elif [ -f "$NODE_HOME/bin/ohpm" ]; then echo "OHPM=$NODE_HOME/bin/ohpm" >> "$GITHUB_ENV"
          else echo "警告: 未找到 ohpm，将尝试 npm install -g @ohos/ohpm-cli（部分版本 CLT 不自带）"; fi

      # --------------------------------------------------------
      # （可选）安装 ohpm —— 部分老版 CLT 不自带 ohpm 命令
      # --------------------------------------------------------
      - name: 安装 ohpm（如果缺失）
        run: |
          if [ -z "${OHPM:-}" ]; then
            npm install -g @ohos/ohpm-cli 2>&1 | tail -5
            echo "OHPM=$(dirname $(dirname $(npm root -g)))/bin/ohpm" >> "$GITHUB_ENV"
          fi
          ${OHPM:-ohpm} -v

      # --------------------------------------------------------
      # OHPM 依赖安装（带缓存加速）
      # --------------------------------------------------------
      - name: 缓存 ohpm 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.ohpm
            oh_modules
            entry/oh_modules
          key: ohpm-${{ runner.os }}-${{ hashFiles('oh-package-lock.json5', 'entry/oh-package.json5') }}
          restore-keys: |
            ohpm-${{ runner.os }}-

      - name: 安装 OHPM 依赖
        run: |
          set -euo pipefail
          OHPM_BIN="${OHPM:-ohpm}"
          if [ -n "$OHPM_REGISTRY" ]; then
            "$OHPM_BIN" config set registry "$OHPM_REGISTRY"
          fi
          "$OHPM_BIN" install --all 2>&1 | tail -20

      # --------------------------------------------------------
      # 注入版本号（与 bin/build 逻辑一致：perl 写入，不修改原仓库 —— CI 无需还原）
      # --------------------------------------------------------
      - name: 注入版本号到 AppScope/app.json5
        run: |
          set -euo pipefail
          echo "注入 versionName=$VERSION  versionCode=$VERSION_CODE → AppScope/app.json5"
          perl -i -pe "
            s/\"versionCode\"\s*:\s*\d+/\"versionCode\": $VERSION_CODE/;
            s/\"versionName\"\s*:\s*\"[^\"]+\"/\"versionName\": \"$VERSION\"/;
          " AppScope/app.json5
          # 剥离工程内调试签名（material 是 Mac 本机加密材料，CI 容器无法解析，hvigor SignHap 会报 00303107；
          # 且 hvigor 直接签名要求 DevEco 加密密码，明文密码报 00303116）
          # → 让 hvigor 产出 unsigned HAP，由后续 hap-sign-tool 步骤用 release 证书重签名
          perl -0pi -e 's/\n\s*"signingConfig":\s*"default",//' build-profile.json5
          perl -0pi -e 's/"signingConfigs":\s*\[.*?\]/"signingConfigs": []/s' build-profile.json5
          echo "--- build-profile.json5 调试签名已剥离 ---"
          echo "--- 注入结果 ---"
          cat AppScope/app.json5

      # --------------------------------------------------------
      # 校验签名材料（仓库 signature/ 目录随 checkout 就绪：release.p12/.cer/.p7b）
      # 注意：签发动作在构建之后由 hap-sign-tool 完成（hap-sign-tool 用明文密码；
      #       hvigor 直接签名依赖 DevEco 本机加密串 + material 环境，实测 00303242 跨机不可行）
      # --------------------------------------------------------
      - name: 校验签名材料
        run: |
          set -euo pipefail
          MATERIAL_DIR="$GITHUB_WORKSPACE/signature"
          # 必填文件校验
          for f in release.p12 release.cer release.p7b; do
            [ -f "$MATERIAL_DIR/$f" ] || { echo "错误: 缺少 signature/$f，请将发布签名材料提交到仓库 signature/ 目录"; exit 1; }
          done
          ls -lh "$MATERIAL_DIR"
          # SHA256 指纹（便于人工比对 AGC 控制台）
          echo "--- 证书指纹 ---"
          keytool -printcert -file "$MATERIAL_DIR/release.cer" 2>/dev/null | grep -E "SHA256|指纹" || true
          echo "MATERIAL_DIR=$MATERIAL_DIR" >> "$GITHUB_ENV"

      # --------------------------------------------------------
      # 生成 BuildInfo.ets（构建溯源信息，App「关于 → 构建信息」展示 + 防伪比对依据）
      #   RUN_ID/RUN_NUMBER 由 GitHub 注入，伪造包无法在官方仓库创建对应 run 记录
      # --------------------------------------------------------
      - name: 生成 BuildInfo.ets（构建溯源信息）
        id: buildinfo
        run: |
          set -euo pipefail
          # tag push 场景下 github.sha 可能指向 tag 对象，用 git rev-parse HEAD 拿真实 commit 更可靠
          COMMIT_SHA="$(git rev-parse HEAD)"
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p entry/src/main/ets/generated
          cat > entry/src/main/ets/generated/BuildInfo.ets <<EOF
          /**
           * 构建溯源信息（自动生成文件 —— 请勿手动修改）
           * 由 GitHub Actions release.yml 生成
           */
          export class BuildInfo {
            /** 构建来源：github-actions / local */
            static readonly BUILD_HOST: string = 'github-actions';
            /** GitHub Actions Run ID（云端构建记录页 /actions/runs/{RUN_ID}）；本地构建为空串 */
            static readonly RUN_ID: string = '${{ github.run_id }}';
            /** GitHub Actions Run 编号（页面展示用） */
            static readonly RUN_NUMBER: string = '${{ github.run_number }}';
            /** 构建对应的 commit SHA（完整 40 位） */
            static readonly COMMIT_SHA: string = '$COMMIT_SHA';
            /** 构建时间（UTC，ISO 8601 格式） */
            static readonly BUILD_TIME: string = '$BUILD_TIME';
          }
          EOF
          echo "--- BuildInfo.ets ---"
          cat entry/src/main/ets/generated/BuildInfo.ets
          echo "commit_sha=$COMMIT_SHA"   >> "$GITHUB_OUTPUT"
          echo "build_time=$BUILD_TIME"   >> "$GITHUB_OUTPUT"

      # --------------------------------------------------------
      # 构建 unsigned APP（release 模式，signingConfigs 已剥离）
      #   assembleApp = 工程级打包，.app = zip(pac.json + pack.info + HAP)，全部由 hvigor 生成
      #   签名配置为空时 hvigor 跳过签名产出 unsigned.app（"No signingConfig" WARN 可忽略）
      #   签发由后续 hap-sign-tool 完成（hvigor 直接签名需 DevEco 本机加密密码，CI 报 00303116）
      # --------------------------------------------------------
      - name: 构建 APP（release）
        run: |
          set -euo pipefail
          "$HVIGORW" assembleApp -p product=default -p buildMode=release --no-daemon 2>&1 | tail -40

          OUTDIR="build/outputs/default"
          echo "--- 构建产物 ($OUTDIR) ---"
          ls -lh "$OUTDIR" || { echo "错误: 产物目录不存在，构建失败"; exit 1; }

      # --------------------------------------------------------
      # 定位 unsigned APP
      # --------------------------------------------------------
      - name: 定位 unsigned APP
        id: find_unsigned
        run: |
          set -euo pipefail
          APP="$(find build/outputs -name '*-unsigned.app' -type f 2>/dev/null | head -n1)"
          if [ -z "$APP" ]; then
            echo "错误: 未找到 unsigned .app，产物文件:"
            find build/outputs -type f 2>/dev/null | head
            exit 1
          fi
          echo "unsigned_app=$APP" >> "$GITHUB_OUTPUT"
          echo "找到 unsigned APP: $APP"
          ls -lh "$APP"

      # --------------------------------------------------------
      # 提取签名证书指纹（SHA-256，与 App 运行时 signatureInfo.fingerprint 同源）
      # 公布到 Release notes，用户与手机「关于 → 构建信息」中尾 8 位比对即可防伪
      # --------------------------------------------------------
      - name: 提取签名证书指纹（SHA-256）
        id: cert_fp
        run: |
          set -euo pipefail
          RAW="$(keytool -printcert -file "$MATERIAL_DIR/release.cer" 2>/dev/null | grep -m1 'SHA256:')"
          if [ -z "$RAW" ]; then
            echo "错误: 未能从 release.cer 提取 SHA-256 指纹"
            keytool -printcert -file "$MATERIAL_DIR/release.cer" || true
            exit 1
          fi
          # 去掉冒号/空格、统一小写，得到 64 位十六进制串（与 signatureInfo.fingerprint 一致）
          FP="$(echo "$RAW" | sed 's/.*SHA256: *//' | tr -d ': ' | tr 'A-F' 'a-f')"
          echo "签名证书指纹: $FP"
          echo "fingerprint=$FP" >> "$GITHUB_OUTPUT"
          # 指纹文件随 artifact 上传并挂到 Release
          echo "$FP" > "$HOME/cert_fingerprint.txt"

      # --------------------------------------------------------
      # 定位签名工具 hap-sign-tool.jar（SDK toolchains/lib 下）
      # --------------------------------------------------------
      - name: 定位签名工具 hap-sign-tool.jar
        id: find_jarsigner
        run: |
          set -euo pipefail
          JAR="$(find "$DEVECO_SDK_HOME" -name 'hap-sign-tool.jar' -type f 2>/dev/null | head -n1)"
          if [ -z "$JAR" ]; then
            echo "错误: 在 DEVECO_SDK_HOME=$DEVECO_SDK_HOME 下找不到 hap-sign-tool.jar"
            find "$DEVECO_SDK_HOME" -name '*.jar' 2>/dev/null | head -20 || true
            exit 1
          fi
          echo "hap_sign_tool_jar=$JAR" >> "$GITHUB_OUTPUT"
          echo "找到签名工具: $JAR"

      # --------------------------------------------------------
      # .app 整体重签名（release 证书）
      #   sign-app 将签名块写入 zip 内部（内容 → 签名块 → 中央目录 → EOCD，APK v2 同款布局）
      #   （mode=localSign，SHA256withECDSA —— HarmonyOS 要求；hap-sign-tool 用明文密码）
      # --------------------------------------------------------
      - name: .app 重签名（release 证书）
        id: sign
        env:
          SIGN_STORE_PASSWORD: ${{ secrets.SIGN_STORE_PASSWORD }}
          SIGN_KEY_PASSWORD:   ${{ secrets.SIGN_KEY_PASSWORD }}
          SIGN_KEY_ALIAS:      ${{ secrets.SIGN_KEY_ALIAS }}
        run: |
          set -euo pipefail
          # 必填密码/别名校验
          for v in SIGN_STORE_PASSWORD SIGN_KEY_PASSWORD SIGN_KEY_ALIAS; do
            VAL="${!v}"
            if [ -z "$VAL" ]; then
              echo "错误: secret $v 未配置（SIGN_STORE_PASSWORD / SIGN_KEY_PASSWORD / SIGN_KEY_ALIAS）"
              exit 1
            fi
          done
          UNSIGNED_APP="${{ steps.find_unsigned.outputs.unsigned_app }}"
          SIGNED_APP="$HOME/app-signed.tmp"
          JAR="${{ steps.find_jarsigner.outputs.hap_sign_tool_jar }}"

          echo "执行 .app 整体签名（敏感参数已屏蔽显示）:"
          java -jar "$JAR" sign-app \
            -mode          localSign \
            -keyAlias      "$SIGN_KEY_ALIAS" \
            -signAlg       SHA256withECDSA \
            -keystoreFile  "$MATERIAL_DIR/release.p12" \
            -keystorePwd   "$SIGN_STORE_PASSWORD" \
            -keyPwd        "$SIGN_KEY_PASSWORD" \
            -appCertFile   "$MATERIAL_DIR/release.cer" \
            -profileFile   "$MATERIAL_DIR/release.p7b" \
            -inFile        "$UNSIGNED_APP" \
            -outFile       "$SIGNED_APP"
          if [ ! -f "$SIGNED_APP" ]; then echo "错误: 签名失败，未生成签名产物"; exit 1; fi

          # 自检 1：zip 结构完整
          unzip -t "$SIGNED_APP" > /dev/null || { echo "错误: 签名产物 zip 结构损坏"; exit 1; }
          # 自检 2：签名产物必须大于 unsigned 源包（签名块增加体积）
          U_SIZE=$(stat -c%s "$UNSIGNED_APP"); S_SIZE=$(stat -c%s "$SIGNED_APP")
          [ "$S_SIZE" -gt "$U_SIZE" ] || { echo "错误: 签名产物(${S_SIZE}B) 未大于源包(${U_SIZE}B)，签名未生效"; exit 1; }
          # 自检 3：产物体积对比已证明签名块写入（sign-app success + 体积增大）
          # 终极校验交给 AGC 上传环节（包不合法会被 AGC 拒收，如 991）
          # 注：verify-app 验签试过但参数挑剔（outCertChain 需特定格式，11012005），不采用
          echo "--- 签名完成 ---"
          ls -lh "$SIGNED_APP"
          echo "signed_app=$SIGNED_APP" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------------
      # 重命名产物 + 计算 SHA256
      #   .app → AGC 上传 + GitHub Release（AGC 唯一合法发布形态）
      #   注：不再单独产出 .hap —— HAP 级签名仅 hvigor（DevEco 本机材料）可完成，
      #   hap-sign-tool 无 HAP 签名子命令；安装请走 AGC 测试/上架渠道
      # --------------------------------------------------------
      - name: 重命名产物 + 计算 SHA256
        id: sha
        run: |
          set -euo pipefail
          VERSION="${{ needs.prepare.outputs.version }}"
          BASENAME="timelynotify-${VERSION}-signed"
          APP_OUT="$HOME/$BASENAME.app"
          cp "${{ steps.sign.outputs.signed_app }}" "$APP_OUT"

          APP_SHA="$(sha256sum "$APP_OUT" | awk '{print $1}')"
          echo "$APP_SHA  $BASENAME.app" > "$HOME/$BASENAME.app.sha256"
          cat "$HOME/$BASENAME.app.sha256"
          # 证书指纹文件随 artifact 上传并挂到 Release（用户防伪比对用）
          cp "$HOME/cert_fingerprint.txt" "$HOME/$BASENAME.app-cert-fingerprint.txt"

          {
            echo "app_out=$APP_OUT" >> "$GITHUB_OUTPUT"
            echo "sha256=$APP_SHA" >> "$GITHUB_OUTPUT"
          }
          echo "--- 最终产物 ---"
          ls -lh "$APP_OUT"

      # --------------------------------------------------------
      # Artifact Attestation（GitHub 官方密钥签名的构建溯源证明，SLSA provenance）
      # 技术用户可用一条命令验证包由本仓库本 workflow 构建：
      #   gh attestation verify <文件> -R <owner>/<repo>
      # 公开仓库免费支持；私有仓库需 Enterprise Cloud
      # --------------------------------------------------------
      - name: 生成构建溯源证明（APP）
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: ${{ steps.sha.outputs.app_out }}

      - name: 生成构建溯源证明（SHA256）
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: ${{ steps.sha.outputs.app_out }}.sha256

      - name: 上传 Artifact（APP）
        uses: actions/upload-artifact@v4
        with:
          name: timelynotify-${{ needs.prepare.outputs.version }}-packages
          path: |
            ${{ steps.sha.outputs.app_out }}
            ${{ steps.sha.outputs.app_out }}.sha256
            ${{ steps.sha.outputs.app_out }}-cert-fingerprint.txt
          if-no-files-found: error
          retention-days: 90

# ============================================================
# Job 3 · upload-agc —— 纯 curl 调 AGC Publish API 上传软件包
#   流程（官方文档: Publishing API指南 + Upload Management API）:
#     1. POST /api/oauth2/v1/token                （JSON body，client_credentials）
#     2. GET  /api/publish/v2/upload-url/for-obs  （必须带 Content-Type: application/json，
#                                                  否则网关报 205524993 "client token auth failed"）
#     3. PUT  <OBS url>                           （headers 原样透传，curl 自动补 Content-Length 参与签名）
#     4. PUT  /api/publish/v3/app-package-info    （登记包信息后软件包管理才可见；v2 为 404）
#   说明: 仅上传+登记，不提交发布/测试 —— 提交动作由开发者在 AGC 控制台手动完成
# ============================================================
  upload-agc:
    name: Upload to AGC
    needs: [prepare, build-sign]
    if: needs.prepare.outputs.skip_agc_upload != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: 下载 artifact（APP）
        uses: actions/download-artifact@v4
        with:
          name: timelynotify-${{ needs.prepare.outputs.version }}-packages
          path: ./artifact

      - name: 上传 .app 到 AGC
        env:
          AGC_CLIENT_ID:     ${{ secrets.AGC_CLIENT_ID }}
          AGC_CLIENT_SECRET: ${{ secrets.AGC_CLIENT_SECRET }}
          AGC_APP_ID:        ${{ secrets.AGC_APP_ID }}
          RELEASE_TYPE:      ${{ needs.prepare.outputs.release_type }}
          VERSION:           ${{ needs.prepare.outputs.version }}
          BUNDLE_NAME:       cn.oicode.timelynotify
        run: |
          set -euo pipefail
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          API="https://connect-api.cloud.huawei.com"

          # ---- 0. 凭证与输入校验 ----
          for v in AGC_CLIENT_ID AGC_CLIENT_SECRET AGC_APP_ID; do
            [ -n "${!v}" ] || { echo "错误: secret $v 未配置"; exit 1; }
          done
          APP_FILE="$(ls ./artifact/*.app | head -n1)"
          [ -f "$APP_FILE" ] || { echo "错误: 未找到 .app artifact"; ls -la ./artifact; exit 1; }
          FILE_NAME="$(basename "$APP_FILE")"
          CONTENT_LENGTH="$(stat -c%s "$APP_FILE" 2>/dev/null || stat -f%z "$APP_FILE")"
          SHA256_HEX="$(sha256sum "$APP_FILE" | awk '{print $1}')"
          echo "待上传: $FILE_NAME ($(du -h "$APP_FILE" | cut -f1))"
          echo "SHA256 : $SHA256_HEX"
          echo "AGC App ID = $AGC_APP_ID"

          # ---- 1. 获取 access_token（JSON body；form 编码会报空错误） ----
          TOKEN_RESP="$(curl -sS -X POST "$API/api/oauth2/v1/token" \
            -H "User-Agent: $UA" -H "Content-Type: application/json" \
            -d "{\"grant_type\":\"client_credentials\",\"client_id\":\"$AGC_CLIENT_ID\",\"client_secret\":\"$AGC_CLIENT_SECRET\"}")"
          TOKEN="$(echo "$TOKEN_RESP" | jq -r '.access_token // empty')"
          [ -n "$TOKEN" ] || { echo "❌ 获取 token 失败:"; echo "$TOKEN_RESP"; exit 1; }
          echo "1/4 access_token 获取成功"

          # ---- 2. 获取文件上传地址（Content-Type: application/json 必带） ----
          URL_RESP="$(curl -sS -G "$API/api/publish/v2/upload-url/for-obs" \
            -H "User-Agent: $UA" -H "client_id: $AGC_CLIENT_ID" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            --data-urlencode "appId=$AGC_APP_ID" \
            --data-urlencode "fileName=$FILE_NAME" \
            --data-urlencode "sha256=$SHA256_HEX" \
            --data-urlencode "contentLength=$CONTENT_LENGTH" \
            --data-urlencode "releaseType=$RELEASE_TYPE")"
          RET_CODE="$(echo "$URL_RESP" | jq -r '.ret.code // .code // empty')"
          [ "$RET_CODE" = "0" ] || { echo "❌ 获取上传地址失败 (ret.code=$RET_CODE):"; echo "$URL_RESP"; exit 1; }
          UPLOAD_URL="$(echo "$URL_RESP" | jq -r '.urlInfo.url')"
          OBJECT_ID="$(echo "$URL_RESP" | jq -r '.urlInfo.objectId')"
          echo "2/4 上传地址获取成功 (objectId: $OBJECT_ID)"

          # ---- 3. PUT 文件到 OBS（headers 原样透传；Content-Length 由 curl 自动补全并参与签名） ----
          mapfile -t HDRS < <(echo "$URL_RESP" | jq -r '.urlInfo.headers | to_entries[] | "-H", "\(.key): \(.value)"')
          HTTP_CODE="$(curl -sS -o /tmp/obs_put_resp.txt -w '%{http_code}' -X PUT "$UPLOAD_URL" "${HDRS[@]}" --data-binary "@$APP_FILE")"
          [ "$HTTP_CODE" = "200" ] || { echo "❌ 文件上传失败 (HTTP $HTTP_CODE):"; cat /tmp/obs_put_resp.txt; exit 1; }
          echo "3/4 文件上传成功 (HTTP 200)"

          # ---- 4. 登记软件包信息（v3；成功后软件包管理可见，异步解析约 2 分钟） ----
          PKG_RESP="$(curl -sS -X PUT "$API/api/publish/v3/app-package-info?appId=$AGC_APP_ID" \
            -H "User-Agent: $UA" -H "client_id: $AGC_CLIENT_ID" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d "{\"fileName\":\"$FILE_NAME\",\"objectId\":\"$OBJECT_ID\"}")"
          RET_CODE="$(echo "$PKG_RESP" | jq -r '.ret.code // empty')"
          [ "$RET_CODE" = "0" ] || { echo "❌ 登记软件包失败 (ret.code=$RET_CODE):"; echo "$PKG_RESP"; exit 1; }
          PACKAGE_ID="$(echo "$PKG_RESP" | jq -r '.packageId // empty')"
          echo "4/4 软件包登记成功 (packageId: $PACKAGE_ID)"
          echo "✅ AGC 上传完成（约 2 分钟后可在 软件包管理 看到解析结果；提交发布/测试请在 AGC 控制台手动操作）"

          # ---- 5. 写入 summary ----
          {
            echo "### AGC 上传结果"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 包名 | \`$BUNDLE_NAME\` |"
            echo "| AGC App ID | \`$AGC_APP_ID\` |"
            echo "| 版本 | $VERSION (releaseType=$RELEASE_TYPE) |"
            echo "| 文件 | \`$FILE_NAME\` |"
            echo "| SHA256 | \`$SHA256_HEX\` |"
            echo "| packageId | \`$PACKAGE_ID\` |"
          } >> "$GITHUB_STEP_SUMMARY"

# ============================================================
# Job 4 · github-release —— 创建 GitHub Release 并挂载 APP / 溯源文件
# ============================================================
  github-release:
    name: GitHub Release
    needs: [prepare, build-sign]
    if: always() && needs.build-sign.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载 artifact（APP）
        uses: actions/download-artifact@v4
        with:
          name: timelynotify-${{ needs.prepare.outputs.version }}-packages
          path: ./artifact

      - name: 列出 artifact 文件
        run: ls -lh ./artifact/

      # GitHub Release 附件禁止 .app 后缀（macOS bundle 黑名单），改挂 .app.zip
      - name: 重命名 .app → .app.zip
        run: |
          set -euo pipefail
          for f in ./artifact/*.app; do
            [ -e "$f" ] || { echo "错误: 未找到 .app artifact"; exit 1; }
            mv "$f" "$f.zip"
          done
          ls -lh ./artifact/

      - name: 创建/更新 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Release ${{ needs.prepare.outputs.version }}
          body: |
            ## TimelyNotify ${{ needs.prepare.outputs.version }}

            - **versionCode**: `${{ needs.prepare.outputs.version_code }}`
            - **versionName**: `${{ needs.prepare.outputs.version }}`
            - **包名**: `cn.oicode.timelynotify`
            - **构建**: [Actions Run #${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - **commit**: `${{ needs.build-sign.outputs.commit_sha }}`
            - **构建时间 (UTC)**: ${{ needs.build-sign.outputs.build_time }}

            ### 防伪校验

            1. **签名证书指纹（SHA-256，64 位）** —— 与 App「我的 → 关于 → 构建信息」中显示的指纹尾 8 位比对：

               ```
               ${{ needs.build-sign.outputs.cert_fingerprint }}
               ```

            2. **文件完整性**（下载后校验，被篡改的包会失配）：

               ```sh
               shasum -a 256 -c timelynotify-${{ needs.prepare.outputs.version }}-signed.app.sha256
               ```

               注：`.app.zip` 解压出的 `.app` 才是被校验对象（`.sha256` 对应解压后的 `.app`）

            3. **构建溯源证明**（技术用户可选，GitHub 官方密钥签名）：

               ```sh
               gh attestation verify timelynotify-${{ needs.prepare.outputs.version }}-signed.app -R ${{ github.repository }}
               ```

            ### 附件说明

            - `timelynotify-${{ needs.prepare.outputs.version }}-signed.app.zip` — 应用包（release 签名，AGC 上架/测试格式；GitHub 附件禁用 .app 后缀故打包为 zip），解压出的 `.app` 可用于校验/上架，已随 CI 上传 AGC 软件包管理
            - `*.sha256` — SHA256 校验和（对应解压后的 .app）
            - `*-cert-fingerprint.txt` — 签名证书指纹（纯文本）
          files: |
            ./artifact/timelynotify-${{ needs.prepare.outputs.version }}-signed.app.zip
            ./artifact/timelynotify-${{ needs.prepare.outputs.version }}-signed.app.sha256
            ./artifact/timelynotify-${{ needs.prepare.outputs.version }}-signed.app-cert-fingerprint.txt
          fail_on_unmatched_files: true
          make_latest: true
          generate_release_notes: false
