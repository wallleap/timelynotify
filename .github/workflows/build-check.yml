name: Build Check — PR 构建检查

# ============================================================
# 用途: 每次 push / PR 到 main / develop 等分支时，跑一次构建（debug + release 模式）
#       确保代码可编译通过，但不执行真实签名（使用 debug 证书或跳过签名）、不上传 AGC。
# ============================================================
on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
      - 'hotfix/**'
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/**'
  workflow_dispatch:

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

env:
  BUNDLE_NAME: cn.oicode.timelynotify
  OHPM_REGISTRY: ${{ vars.OHPM_REGISTRY }}

# 统一用 bash 跑 run 步骤：容器内默认 sh(dash) 不支持 set -o pipefail
defaults:
  run:
    shell: bash

jobs:
  build-check:
    name: Build Check（debug + release）
    runs-on: ${{ vars.BUILD_CHECK_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 25
    # 托管 runner 用自建 GHCR CI 镜像（预装 DevEco CLT + JDK17，见 docker-image.yml）；
    # 表达式结果为空串时 = 不使用容器（self-hosted 走机器上预装的 SDK）
    container: ${{ (vars.BUILD_CHECK_RUNNER == '' || vars.BUILD_CHECK_RUNNER == 'ubuntu-latest') && (vars.CI_IMAGE || format('ghcr.io/{0}/harmonyos-ci:latest', github.repository_owner)) || '' }}
    strategy:
      fail-fast: false
      matrix:
        build_mode: [ debug, release ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17（self-hosted 兜底）
        if: vars.BUILD_CHECK_RUNNER == 'self-hosted'
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # ------------------------------------------------------------
      # 容器内工具链环境（托管 runner）
      #   CI 镜像布局：/opt/harmonyos-tools/command-line-tools/{bin, sdk/default, tool/node}
      # ------------------------------------------------------------
      - name: 容器内工具链环境（托管 runner）
        if: vars.BUILD_CHECK_RUNNER == '' || vars.BUILD_CHECK_RUNNER == 'ubuntu-latest'
        run: |
          set -euo pipefail
          # 容器内当前用户(root)与宿主 checkout 属主(runner)不一致，git 会报 dubious ownership 拒绝操作
          git config --global --add safe.directory "${GITHUB_WORKSPACE:-$(pwd)}"
          CLT_ROOT="/opt/harmonyos-tools/command-line-tools"
          for p in "$CLT_ROOT/sdk/default" "$CLT_ROOT/tool/node" "$CLT_ROOT/bin/hvigorw" "$CLT_ROOT/bin/ohpm"; do
            [ -e "$p" ] || { echo "错误: CI 镜像内缺少 $p"; echo "镜像版本与预期不符？可用仓库 Variable CI_IMAGE 指定其他镜像"; exit 1; }
          done
          echo "DEVECO_SDK_HOME=$CLT_ROOT/sdk" >> "$GITHUB_ENV"
          echo "NODE_HOME=$CLT_ROOT/tool/node"        >> "$GITHUB_ENV"
          echo "HVIGORW=$CLT_ROOT/bin/hvigorw"        >> "$GITHUB_ENV"
          echo "OHPM=$CLT_ROOT/bin/ohpm"              >> "$GITHUB_ENV"

      - name: 环境校验
        run: |
          set -euo pipefail
          : "${DEVECO_SDK_HOME:?缺少 DEVECO_SDK_HOME}"
          : "${NODE_HOME:?缺少 NODE_HOME}"
          HVIGORW="${HVIGORW:-$(command -v hvigorw || true)}"
          : "${HVIGORW:?缺少 HVIGORW}"
          export PATH="$NODE_HOME/bin:$PATH"
          echo "DEVECO_SDK_HOME=$DEVECO_SDK_HOME"
          echo "NODE_HOME=$NODE_HOME"
          echo "HVIGORW=$HVIGORW"
          node -v && java -version
          echo "PATH=$NODE_HOME/bin:$PATH" >> "$GITHUB_ENV"
          echo "HVIGORW=$HVIGORW" >> "$GITHUB_ENV"
          if command -v ohpm >/dev/null 2>&1; then echo "OHPM=$(which ohpm)" >> "$GITHUB_ENV"
          elif [ -f "$DEVECO_SDK_HOME/../tools/ohpm/bin/ohpm" ]; then echo "OHPM=$DEVECO_SDK_HOME/../tools/ohpm/bin/ohpm" >> "$GITHUB_ENV"; fi

      - name: 安装 ohpm（若缺失）
        run: |
          if [ -z "${OHPM:-}" ]; then npm install -g @ohos/ohpm-cli 2>&1 | tail -3
            echo "OHPM=$(dirname $(dirname $(npm root -g)))/bin/ohpm" >> "$GITHUB_ENV"; fi
          ${OHPM:-ohpm} -v

      - name: 缓存 ohpm 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.ohpm
            oh_modules
            entry/oh_modules
          key: ohpm-check-${{ runner.os }}-${{ matrix.build_mode }}-${{ hashFiles('oh-package-lock.json5', 'entry/oh-package.json5') }}
          restore-keys: |
            ohpm-check-${{ runner.os }}-${{ matrix.build_mode }}-
            ohpm-${{ runner.os }}-

      - name: 安装 OHPM 依赖
        run: |
          OHPM_BIN="${OHPM:-ohpm}"
          [ -n "$OHPM_REGISTRY" ] && "$OHPM_BIN" config set registry "$OHPM_REGISTRY" || true
          "$OHPM_BIN" install --all 2>&1 | tail -15

      # ------------------------------------------------------------
      # 注入虚拟版本号（构建必填；不影响仓库任何文件）
      # ------------------------------------------------------------
      - name: 注入版本号（CI 占位）
        run: |
          # 版本号: 0.0.<run_number>（确保构建能生成，不代表真实发布版本）
          V="0.0.${{ github.run_number }}"
          VC="${{ github.run_number }}"
          perl -i -pe "
            s/\"versionCode\"\s*:\s*\d+/\"versionCode\": $VC/;
            s/\"versionName\"\s*:\s*\"[^\"]+\"/\"versionName\": \"$V\"/;
          " AppScope/app.json5
          # 剥离工程内调试签名（本机加密材料 CI 无法解析）→ 产出 unsigned HAP，构建检查只验证编译链路
          perl -0pi -e 's/\n\s*"signingConfig":\s*"default",//' build-profile.json5
          perl -0pi -e 's/"signingConfigs":\s*\[.*?\]/"signingConfigs": []/s' build-profile.json5
          echo "注入版本 $V (versionCode=$VC)"
          cat AppScope/app.json5

      # ------------------------------------------------------------
      # 构建 —— 只做编译验证，不需要真正可安装的签名包
      # ------------------------------------------------------------
      - name: 构建 HAP（${{ matrix.build_mode }}）
        run: |
          "$HVIGORW" assembleHap --mode module \
            -p product=default \
            -p buildMode=${{ matrix.build_mode }} \
            --no-daemon 2>&1 | tail -60
          OUTDIR="entry/build/default/outputs/default"
          echo "--- ${{ matrix.build_mode }} 产物 ---"
          ls -lh "$OUTDIR" 2>/dev/null || {
            echo "错误: 构建失败（未生成 output 目录）";
            echo "hvigor 日志前 200 行以辅助排错:";
            find entry/build -name '*.log' -exec echo '== {} ==' \; -exec head -200 {} \; 2>/dev/null || true;
            exit 1;
          }

      # ------------------------------------------------------------
      # 单元测试（Hypium 本地 UT，不需要设备）
      # ------------------------------------------------------------
      - name: 运行本地单元测试（Hypium）
        if: matrix.build_mode == 'debug'
        continue-on-error: true
        run: |
          if grep -q '@ohos/hypium' entry/oh-package.json5 2>/dev/null \
             || grep -q '@ohos/hypium' oh-package.json5 2>/dev/null; then
            echo "=== 检测到 Hypium 依赖，尝试执行 testLocal ==="
            "$HVIGORW" test --mode module -p product=default -p module=entry@default --no-daemon 2>&1 | tail -40 \
              || echo "（Hypium 本地测试执行失败已忽略，可在本地验证）"
          else
            echo "未检测到 Hypium 依赖，跳过单元测试"
          fi
